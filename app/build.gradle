plugins {
    id 'com.android.application'
}

android {
    namespace 'app.pitwall'
    compileSdk 35

    defaultConfig {
        applicationId 'app.pitwall'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs straight away.
            // Replace with your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
